<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Dot Foundry<small>Generator fundamentals lab</small></div>
    <span class="chip" id="dotChip">0 dots</span><span class="chip" id="instanceChip">0 generator areas</span><span class="chip" id="seedChip">seed 0</span>
    <div class="spacer"></div>
    <button id="exportBtn">Export PNG</button><button id="resetBtn">Reset demo</button>
  </header>
  <main class="workspace">
    <div class="left">
      <section class="previewPanel">
        <div class="panelHead"><span class="panelTitle">Frame</span><div class="spacer"></div><label>Gizmos&nbsp; <select id="gizmoMode"><option value="hover">Hovered module</option><option value="selected">Selected module</option><option value="all">All modules</option><option value="none">Off</option></select></label><div class="zoomTools" aria-label="Preview zoom"><button id="zoomOutBtn" title="Zoom out (−)">−</button><span class="zoomReadout" id="zoomReadout">100%</span><button id="zoomInBtn" title="Zoom in (+)">+</button><button id="fitBtn" title="Fit the complete frame (0)">Fit</button></div><button id="reseedBtn">New seed</button></div>
        <div class="canvasWrap" id="previewViewport"><div class="canvasShell" id="canvasShell"><canvas id="canvas" width="900" height="900"></canvas></div><div class="legend" id="legend"></div><div class="hint"><span class="kbd">Wheel</span> zoom · <span class="kbd">Drag</span> pan · <span class="kbd">0</span> fit</div></div>
      </section>
      <section class="treePanel">
        <div class="panelHead"><span class="panelTitle">Generator hierarchy</span><div class="spacer"></div><button id="addChildBtn" class="primary">+ Child generator</button><button id="upBtn" title="Move before sibling">↑</button><button id="downBtn" title="Move after sibling">↓</button><button id="duplicateBtn">Duplicate</button><button id="deleteBtn" class="danger">Delete</button></div>
        <div class="treeScroll" id="tree"></div>
      </section>
    </div>
    <aside class="inspector" id="inspector"></aside>
  </main>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), C=$('#canvas'), ctx=C.getContext('2d'), viewport=$('#previewViewport'), canvasShell=$('#canvasShell');
const STORE='dotFoundry.v1', TAU=Math.PI*2, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
let uid=1, hoveredModule=null, selectedModule='generator', dataCache={}, renderQueued=false;
const view={zoom:1,panX:0,panY:0,fitSize:100,dragging:false,pointerId:null,lastX:0,lastY:0};
function constrainView(){const vw=viewport.clientWidth,vh=viewport.clientHeight,scaled=view.fitSize*view.zoom,margin=16,maxX=Math.max(0,(scaled-vw)/2+margin),maxY=Math.max(0,(scaled-vh)/2+margin);view.panX=clamp(view.panX,-maxX,maxX);view.panY=clamp(view.panY,-maxY,maxY)}
function updateView(){const vw=viewport.clientWidth,vh=viewport.clientHeight;if(!vw||!vh)return;view.fitSize=Math.max(64,Math.min(vw-32,vh-32));canvasShell.style.width=view.fitSize+'px';canvasShell.style.height=view.fitSize+'px';constrainView();canvasShell.style.transform=`translate(calc(-50% + ${view.panX}px),calc(-50% + ${view.panY}px)) scale(${view.zoom})`;$('#zoomReadout').textContent=Math.round(view.zoom*100)+'%'}
function setZoom(next,clientX,clientY){const old=view.zoom,z=clamp(next,.25,8);if(z===old)return;const r=viewport.getBoundingClientRect(),ax=(clientX??r.left+r.width/2)-r.left-r.width/2,ay=(clientY??r.top+r.height/2)-r.top-r.height/2,contentX=(ax-view.panX)/old,contentY=(ay-view.panY)/old;view.zoom=z;view.panX=ax-contentX*z;view.panY=ay-contentY*z;updateView()}
function fitView(){view.zoom=1;view.panX=0;view.panY=0;updateView()}
const rid=(p='id')=>p+'_'+(uid++).toString(36);
function hash(a,b=0,c=0){let x=(a|0)^Math.imul((b|0)+0x9e3779b9,0x85ebca6b)^Math.imul((c|0)+17,0xc2b2ae35);x^=x>>>16;x=Math.imul(x,0x7feb352d);x^=x>>>15;x=Math.imul(x,0x846ca68b);x^=x>>>16;return(x>>>0)/4294967296}
function defaultSelector(type){return type==='margin'?{id:rid('sel'),type,name:'Edge margin',enabled:true,width:22,zone:'band',softness:8,bandChance:100,coreChance:0}:{id:rid('sel'),type,name:type==='gradient'?'Directional gradient':'Random mask',enabled:true,...(type==='gradient'?{mode:'linear',angle:0,offset:0,contrast:100,invert:false,phase:0,frequency:2}:{strength:55,seed:19})}}
function defaultMutator(type){if(type==='nudge')return{id:rid('mut'),type,name:'Nudge',enabled:true,selector:'all',strength:3,seed:31,bias:0,angle:0};if(type==='warp')return{id:rid('mut'),type,name:'Warp field',enabled:true,selector:'all',field:'points',force:'pull',strength:7,count:2,radius:45,seed:71,lineAngle:0,lineSpacing:24};return{id:rid('mut'),type,name:'Cull',enabled:true,selector:'all',mode:'outside',seed:43}}
function defaultFill(type='flat',a='#26384a',b='#6bb6d9'){return{id:rid('fill'),type,colorA:a,colorB:b,angle:90}}
function defaultDrawer(){return{id:rid('draw'),type:'fill',name:'Fill shapes',enabled:true,target:'areas',selector:'all',selection:'selected',threshold:50,cellScaleX:62,cellScaleY:62,cellShape:'square',source:'single',fillType:'flat',colorA:'#26384a',colorB:'#6bb6d9',angle:90,opacity:100,seed:211,fills:[defaultFill('flat','#26384a','#26384a'),defaultFill('gradient','#293449','#79b4d2'),defaultFill('gradient','#463247','#d38d78')]}}
function placementDefaults(p){const d={boxWidthMin:8,boxWidthMax:18,boxHeightBasis:'area',boxHeightMin:35,boxHeightMax:92,boxAspectMin:1,boxAspectMax:3,boxOverflow:true,boxGap:2,boxPadding:2,boxAlign:'bottom',boxSeed:101};for(const [k,v] of Object.entries(d))if(p[k]==null)p[k]=v;return p}
function defaultGen(name='Generator',isRoot=false){return{id:rid('gen'),name,enabled:true,color:isRoot?'#70e1a1':'#62d8ff',dotSize:isRoot?4:3,showDots:true,shape:isRoot?'square':'ellipse',sizeX:isRoot?100:22,sizeY:isRoot?100:22,rotation:0,anchor:'center',areaBasis:'parent',spawnEvery:1,spawnChance:100,maxInstances:isRoot?1:80,placement:placementDefaults({id:rid('place'),type:'grid',enabled:true,cols:isRoot?8:4,rows:isRoot?7:4,gapX:0,gapY:0,skewX:0,skewY:0,rotation:0,offsetX:0,offsetY:0}),selectors:[],mutators:[],drawers:[],children:[]}}
function normalizeGen(g,isRoot=false){if(!g.anchor)g.anchor='center';if(!g.areaBasis)g.areaBasis='parent';if(g.sizeX==null)g.sizeX=isRoot?100:22;if(g.sizeY==null)g.sizeY=isRoot?100:22;if(g.rotation==null)g.rotation=0;placementDefaults(g.placement);g.drawers||=[];for(const d of g.drawers){d.fills||=[defaultFill()];if(d.opacity==null)d.opacity=100;if(d.seed==null)d.seed=211;if(!d.selection)d.selection='selected';if(d.threshold==null)d.threshold=50}(g.children||=[]).forEach(c=>normalizeGen(c,false));return g}
function demo(){uid=1;const root=defaultGen('Root Frame',true);root.showDots=false;root.selectors=[{...defaultSelector('margin'),name:'Safe frame',width:8,zone:'core',softness:3,bandChance:0,coreChance:100}];root.mutators=[{...defaultMutator('nudge'),name:'Loose lattice',selector:root.selectors[0].id,strength:2.2,bias:18,angle:-12}];
 const rings=defaultGen('Radial Clusters');rings.color='#62d8ff';rings.shape='ellipse';rings.sizeX=20;rings.sizeY=20;rings.spawnEvery=2;rings.spawnChance=78;rings.maxInstances=24;rings.placement={id:rid('place'),type:'radial',enabled:true,rings:3,dots:7,minRadius:18,maxRadius:88,direction:'center',spacingCurve:0,densityScale:45,phase:8,rotation:0,includeCenter:true};rings.selectors=[{...defaultSelector('gradient'),name:'Light sweep',angle:-28,offset:10,contrast:125}];rings.mutators=[{...defaultMutator('warp'),name:'Gather',selector:rings.selectors[0].id,field:'points',force:'pull',strength:4.5,count:1,radius:55,seed:12},{...defaultMutator('cull'),name:'Fade out',selector:rings.selectors[0].id,mode:'outside',seed:92}];
 const diamonds=defaultGen('Diamond Grids');diamonds.color='#ffcc66';diamonds.shape='diamond';diamonds.sizeX=13;diamonds.sizeY=13;diamonds.spawnEvery=4;diamonds.spawnChance=70;diamonds.maxInstances=12;diamonds.placement.cols=4;diamonds.placement.rows=4;diamonds.placement.rotation=45;diamonds.placement.gapX=7;diamonds.placement.gapY=7;diamonds.selectors=[{...defaultSelector('random'),name:'Broken cells',strength:72,seed:22}];diamonds.mutators=[{...defaultMutator('cull'),selector:diamonds.selectors[0].id,mode:'outside',seed:28}];root.children=[rings,diamonds];return{seed:4821,selectedId:rings.id,gizmoMode:'hover',root}}
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s&&s.root){uid=Date.now()%100000;normalizeGen(s.root,true);return s}}catch(e){}return demo()}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function allGens(g=state.root,out=[]){out.push(g);g.children.forEach(c=>allGens(c,out));return out}
function findGen(id,g=state.root,parent=null){if(g.id===id)return{g,parent};for(const c of g.children){const f=findGen(id,c,g);if(f)return f}return null}
function selected(){return findGen(state.selectedId)?.g||state.root}
function shapeInside(x,y,shape){if(shape==='ellipse')return x*x*4+y*y*4<=1;if(shape==='diamond')return(Math.abs(x)+Math.abs(y))*2<=1;return Math.abs(x)<=.5&&Math.abs(y)<=.5}
function edgeDepth(x,y,shape){if(shape==='ellipse')return clamp(1-Math.sqrt(x*x*4+y*y*4));if(shape==='diamond')return clamp(1-(Math.abs(x)+Math.abs(y))*2);return clamp(Math.min(.5-Math.abs(x),.5-Math.abs(y))*2)}
function xform(p,a){const ca=Math.cos(a.rot),sa=Math.sin(a.rot);return{x:a.cx+(p.x*ca-p.y*sa)*a.w,y:a.cy+(p.x*sa+p.y*ca)*a.h}}
function invform(p,a){const dx=p.x-a.cx,dy=p.y-a.cy,ca=Math.cos(-a.rot),sa=Math.sin(-a.rot);return{x:(dx*ca-dy*sa)/a.w,y:(dx*sa+dy*ca)/a.h}}
const anchorVectors={topLeft:[-.5,-.5],top:[0,-.5],topRight:[.5,-.5],left:[-.5,0],center:[0,0],right:[.5,0],bottomLeft:[-.5,.5],bottom:[0,.5],bottomRight:[.5,.5]};

function anchorCtl(current){const name=anchorItems.find(a=>a[0]===current)?.[1]||'Center';return`<div class="anchorControl"><div class="anchorGrid">${anchorItems.map(a=>`<button class="${current===a[0]?'active':''}" data-anchor="${a[0]}" title="${a[1]}" aria-label="${a[1]}"></button>`).join('')}</div><span class="anchorName">${name}</span></div>`}
function moduleCard(id,title,kind,body,enabled,scope,index,canDelete=true){const order=scope==='mutator'||scope==='drawer'?`<button data-move-module="-1" data-move-scope="${scope}" data-index="${index}" title="Move earlier">↑</button><button data-move-module="1" data-move-scope="${scope}" data-index="${index}" title="Move later">↓</button>`:'';return`<div class="module" data-module="${id}"><div class="moduleHead"><span class="chev">▾</span>${toggle(enabled,`data-scope="${scope}" data-key="enabled" ${index!=null?`data-index="${index}"`:''} data-rerender="1"`)}<div class="moduleTitle">${title}<div class="moduleKind">${kind}</div></div><div class="moduleTools">${order}${canDelete?`<button data-remove="${scope}" data-index="${index}" title="Remove">×</button>`:''}</div></div><div class="moduleBody">${enabled?body:'<div class="help">Module disabled. Its controls and effect are hidden.</div>'}</div></div>`}
function selectorOptions(g,current){return[['all','All dots'],...g.selectors.map(s=>[s.id,s.name])].map(o=>`<option value="${o[0]}" ${current===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}
function placementBody(g){const p=g.placement;let h=row('Method',selectCtl(p.type,[['grid','Grid'],['boxRow','Box Row'],['radial','Radial grid']],'type','placement',null,true));if(p.type==='grid'){h+=row('Columns',range(p.cols,1,28,1,'cols','placement'))+row('Rows',range(p.rows,1,28,1,'rows','placement'))+row('X line gap',range(p.gapX,0,80,1,'gapX','placement',null,'%'))+row('Y line gap',range(p.gapY,0,80,1,'gapY','placement',null,'%'))+row('Skew X',range(p.skewX,-80,80,1,'skewX','placement',null,'%'))+row('Skew Y',range(p.skewY,-80,80,1,'skewY','placement',null,'%'))+row('Grid rotation',range(p.rotation,-180,180,1,'rotation','placement',null,'°'))+row('Offset X',range(p.offsetX,-50,50,1,'offsetX','placement',null,'%'))+row('Offset Y',range(p.offsetY,-50,50,1,'offsetY','placement',null,'%'))}else if(p.type==='boxRow'){h+=`<div class="help">Packs boxes across the area's width. With outside growth enabled, top/centre/bottom acts as a baseline and boxes may extend beyond the Generator Area.</div>`+row('Minimum width',range(p.boxWidthMin,1,50,.5,'boxWidthMin','placement',null,'%'))+row('Maximum width',range(p.boxWidthMax,1,60,.5,'boxWidthMax','placement',null,'%'))+row('Height basis',selectCtl(p.boxHeightBasis,[['area','Generator area height'],['width','Multiple of box width']],'boxHeightBasis','placement',null,true));if(p.boxHeightBasis==='width')h+=row('Minimum height',range(p.boxAspectMin,.1,10,.1,'boxAspectMin','placement',null,'× width'))+row('Maximum height',range(p.boxAspectMax,.1,10,.1,'boxAspectMax','placement',null,'× width'));else h+=row('Minimum height',range(p.boxHeightMin,1,p.boxOverflow?1000:100,1,'boxHeightMin','placement',null,'%'))+row('Maximum height',range(p.boxHeightMax,1,p.boxOverflow?1000:100,1,'boxHeightMax','placement',null,'%'));h+=row('Grow outside area',toggle(p.boxOverflow,'data-scope="placement" data-key="boxOverflow" data-rerender="1"'))+row('Equal gap',range(p.boxGap,0,20,.5,'boxGap','placement',null,'%'))+row('Edge padding',range(p.boxPadding,0,25,.5,'boxPadding','placement',null,'%'))+row('Vertical anchor',selectCtl(p.boxAlign,[['bottom','Bottom / grow upward'],['center','Centre'],['top','Top / grow downward']],'boxAlign','placement'))+row('Variation seed',range(p.boxSeed,0,999,1,'boxSeed','placement'))}else{h+=row('Flow',selectCtl(p.direction,[['center','Center → edge'],['edge','Edge → center']],'direction','placement'))+row('Rings',range(p.rings,1,14,1,'rings','placement'))+row('Base dots / ring',range(p.dots,1,36,1,'dots','placement'))+row('Inner radius',range(p.minRadius,0,95,1,'minRadius','placement',null,'%'))+row('Outer radius',range(p.maxRadius,5,100,1,'maxRadius','placement',null,'%'))+row('Ring spacing curve',range(p.spacingCurve,-100,100,1,'spacingCurve','placement'))+row('Outer density scale',range(p.densityScale,-90,180,1,'densityScale','placement',null,'%'))+row('Phase',range(p.phase,0,100,1,'phase','placement',null,'%'))+row('Rotation',range(p.rotation,-180,180,1,'rotation','placement',null,'°'))+row('Center dot',toggle(p.includeCenter,'data-scope="placement" data-key="includeCenter"'))}return h}
function selectorBody(s,i){let h=row('Name',`<input type="text" value="${esc(s.name)}" data-scope="selector" data-index="${i}" data-key="name" data-rerender="1">`);if(s.type==='margin'){h+=row('Band width',range(s.width,0,50,1,'width','selector',i,'%'))+row('Softness',range(s.softness,0,40,1,'softness','selector',i,'%'))+row('Edge band value',range(s.bandChance,0,100,1,'bandChance','selector',i,'%'))+row('Inner core value',range(s.coreChance,0,100,1,'coreChance','selector',i,'%'))}else if(s.type==='gradient'){h+=row('Field',selectCtl(s.mode,[['linear','Linear'],['wave','Wave']],'mode','selector',i,true))+row('Angle',range(s.angle,-180,180,1,'angle','selector',i,'°'))+row('Offset',range(s.offset,-100,100,1,'offset','selector',i,'%'))+row('Contrast',range(s.contrast,10,250,1,'contrast','selector',i,'%'));if(s.mode==='wave')h+=row('Frequency',range(s.frequency,1,8,.1,'frequency','selector',i))+row('Phase',range(s.phase,0,100,1,'phase','selector',i,'%'));h+=row('Invert',toggle(s.invert,`data-scope="selector" data-index="${i}" data-key="invert"`))}else h+=row('Selected amount',range(s.strength,0,100,1,'strength','selector',i,'%'))+row('Seed offset',range(s.seed,0,999,1,'seed','selector',i));return h}
function mutatorBody(m,i,g){let h=row('Name',`<input type="text" value="${esc(m.name)}" data-scope="mutator" data-index="${i}" data-key="name" data-rerender="1">`)+row('Selector',`<select data-scope="mutator" data-index="${i}" data-key="selector">${selectorOptions(g,m.selector)}</select>`);if(m.type==='nudge'){h+=row('Maximum nudge',range(m.strength,0,20,.1,'strength','mutator',i,'%'))+row('Seed offset',range(m.seed,0,999,1,'seed','mutator',i))+row('Direction bias',range(m.bias,0,100,1,'bias','mutator',i,'%'));if(m.bias>0)h+=row('Bias angle',range(m.angle,-180,180,1,'angle','mutator',i,'°'))}else if(m.type==='warp'){h+=row('Field source',selectCtl(m.field,[['points','Point centers'],['lines','Parallel lines']],'field','mutator',i,true))+row('Force',selectCtl(m.force,[['pull','Pull / cluster'],['push','Push / disperse']],'force','mutator',i))+row('Strength',range(m.strength,0,25,.1,'strength','mutator',i,'%'));if(m.field==='points')h+=row('Centers',range(m.count,1,8,1,'count','mutator',i))+row('Influence radius',range(m.radius,5,120,1,'radius','mutator',i,'%'))+row('Seed offset',range(m.seed,0,999,1,'seed','mutator',i));else h+=row('Line angle',range(m.lineAngle,-180,180,1,'lineAngle','mutator',i,'°'))+row('Line spacing',range(m.lineSpacing,5,80,1,'lineSpacing','mutator',i,'%'))}else h+=row('Cull action',selectCtl(m.mode,[['outside','Cull unselected'],['inside','Cull selected']],'mode','mutator',i))+row('Seed offset',range(m.seed,0,999,1,'seed','mutator',i));return h}
function singleFillBody(d,i){let h=row('Fill style',selectCtl(d.fillType,[['flat','Flat'],['gradient','Gradient']],'fillType','drawer',i,true))+row(d.fillType==='flat'?'Color':'Color A',`<input class="colorInput" type="color" value="${d.colorA}" data-scope="drawer" data-index="${i}" data-key="colorA">`);if(d.fillType==='gradient')h+=row('Color B',`<input class="colorInput" type="color" value="${d.colorB}" data-scope="drawer" data-index="${i}" data-key="colorB">`)+row('Gradient angle',range(d.angle,-180,180,1,'angle','drawer',i,'°'));return h}
function fillListBody(d,di){return`<div class="fillList">${d.fills.map((f,fi)=>`<div class="fillItem"><select data-drawer-index="${di}" data-fill-index="${fi}" data-fill-key="type" data-rerender="1"><option value="flat" ${f.type==='flat'?'selected':''}>Flat</option><option value="gradient" ${f.type==='gradient'?'selected':''}>Gradient</option></select><input type="color" value="${f.colorA}" data-drawer-index="${di}" data-fill-index="${fi}" data-fill-key="colorA">${f.type==='gradient'?`<input type="color" value="${f.colorB}" data-drawer-index="${di}" data-fill-index="${fi}" data-fill-key="colorB"><div class="angleCtl"><input type="range" min="-180" max="180" step="1" value="${f.angle}" data-drawer-index="${di}" data-fill-index="${fi}" data-fill-key="angle"><span class="value">${f.angle}°</span></div>`:'<span></span><span class="help">Flat</span>'}<button data-remove-fill="${fi}" data-drawer-index="${di}" title="Remove fill" ${d.fills.length<=1?'disabled':''}>×</button></div>`).join('')}</div><div class="miniActions"><button data-add-fill="flat" data-drawer-index="${di}">+ Flat</button><button data-add-fill="gradient" data-drawer-index="${di}">+ Gradient</button></div>`}
function drawerBody(d,i,g){let h=row('Name',`<input type="text" value="${esc(d.name)}" data-scope="drawer" data-index="${i}" data-key="name" data-rerender="1">`)+row('Draw target',selectCtl(d.target,[['areas','Generator areas'],['cells','Placement cells']],'target','drawer',i,true));if(d.target==='cells'){h+=row('Selector',`<select data-scope="drawer" data-index="${i}" data-key="selector">${selectorOptions(g,d.selector)}</select>`)+row('Use',selectCtl(d.selection,[['selected','Selected'],['inverse','Inverse']],'selection','drawer',i))+row('Threshold',range(d.threshold,0,100,1,'threshold','drawer',i,'%'))+row('Cell shape',selectCtl(d.cellShape,[['square','Rectangle'],['ellipse','Ellipse'],['diamond','Diamond']],'cellShape','drawer',i))+row('Cell width',range(d.cellScaleX,1,120,1,'cellScaleX','drawer',i,'%'))+row('Cell height',range(d.cellScaleY,1,120,1,'cellScaleY','drawer',i,'%'))}h+=row('Opacity',range(d.opacity,0,100,1,'opacity','drawer',i,'%'))+row('Fill source',selectCtl(d.source,[['single','Single fill'],['list','Random from list']],'source','drawer',i,true));if(d.source==='single')h+=singleFillBody(d,i);else h+=row('Variation seed',range(d.seed,0,999,1,'seed','drawer',i))+`<div class="subhead">Fill list · chosen per shape</div>${fillListBody(d,i)}`;return h}
function renderInspector(){const g=selected();if(!g){$('#inspector').innerHTML='<div class="emptyInspector">Select a generator</div>';return}const found=findGen(g.id),root=g===state.root,parent=found?.parent,hasCells=parent&&(parent.placement.type==='grid'||parent.placement.type==='boxRow');let html=`<div class="inspectHead"><div class="inspectTitle"><input value="${esc(g.name)}" data-scope="gen" data-key="name" data-rerender="1">${toggle(g.enabled,'data-scope="gen" data-key="enabled" data-rerender="1"')}</div><div class="inspectMeta"><span>${root?'ROOT GENERATOR':'CHILD GENERATOR'}</span><span>•</span><span>${g.children.length} children</span><span>•</span><span>${dataCache[g.id]?.final.length||0} dots</span></div></div><div class="inspectBody"><div class="callout">Placement creates dots and optional cells. Mutators alter the dots; Drawers add visuals. A child can inherit its parent area or the exact cell surrounding its parent dot.</div>`;
 let genBody=row('Dot output',toggle(g.showDots,'data-scope="gen" data-key="showDots"'))+row('Dot color',`<div class="control"><input class="colorInput" type="color" value="${g.color}" data-scope="gen" data-key="color"><span class="value">${g.color}</span></div>`)+row('Dot size',range(g.dotSize,1,8,.5,'dotSize','gen',null,' px'));
 genBody+=`<div class="subhead">${root?'Area inside the fixed frame':'Area attached to each parent dot'}</div>`;if(!root)genBody+=row('Size relative to',selectCtl(g.areaBasis,[['parent','Parent generator area'],...(hasCells?[['cell','Placement cell']]:[])],'areaBasis','gen',null,true));genBody+=row('Shape',selectCtl(g.shape,[['square','Rectangle'],['ellipse','Ellipse'],['diamond','Diamond']],'shape','gen',null,true))+row('Width',range(g.sizeX,2,root?100:200,1,'sizeX','gen',null,'%'))+row('Height',range(g.sizeY,2,root?100:600,1,'sizeY','gen',null,'%'))+row('Anchor',anchorCtl(g.anchor))+row('Rotation',range(g.rotation,-180,180,1,'rotation','gen',null,'°'));
 if(!root)genBody+=`<div class="subhead">Instantiation filter</div>`+row('Use every Nth dot',range(g.spawnEvery,1,12,1,'spawnEvery','gen'))+row('Spawn chance',range(g.spawnChance,0,100,1,'spawnChance','gen',null,'%'))+row('Instance limit',range(g.maxInstances,1,250,1,'maxInstances','gen'));
 html+=`<div class="section" data-module="generator"><div class="sectionHead"><span class="chev">▾</span><div class="sectionTitle">Generator Area</div><span class="moduleKind">Container</span></div><div class="sectionBody">${genBody}</div></div>`;
 html+=moduleCard(g.placement.id,'Dot Placement',g.placement.type==='grid'?'Grid module':g.placement.type==='boxRow'?'Box Row module':'Radial grid module',placementBody(g),g.placement.enabled,'placement',null,false);
 html+=`<div class="subhead">Selectors · reusable 0–1 fields</div>`;if(!g.selectors.length)html+='<div class="help">No selectors. Mutators can still target all dots equally.</div>';g.selectors.forEach((s,i)=>html+=moduleCard(s.id,s.name,s.type+' selector',selectorBody(s,i),s.enabled,'selector',i));
 html+=`<div class="addRow"><div class="addMenu"><button data-menu="selectors">+ Selector</button><div class="menu"><button data-add-selector="margin">Margin selector</button><button data-add-selector="gradient">Gradient selector</button><button data-add-selector="random">Random selector</button></div></div><span></span></div>`;
 html+=`<div class="subhead">Mutators · processed top to bottom</div>`;if(!g.mutators.length)html+='<div class="help">No mutators. Placement dots pass through unchanged.</div>';g.mutators.forEach((m,i)=>html+=moduleCard(m.id,m.name,m.type+' mutator',mutatorBody(m,i,g),m.enabled,'mutator',i));
 html+=`<div class="addRow"><div class="addMenu"><button data-menu="mutators">+ Mutator</button><div class="menu"><button data-add-mutator="nudge">Nudge</button><button data-add-mutator="warp">Warp</button><button data-add-mutator="cull">Cull</button></div></div><span></span></div>`;
 html+=`<div class="subhead">Drawers · visual output after dot processing</div>`;if(!g.drawers.length)html+='<div class="help">No visual output yet. Add a Fill Drawer to paint generator areas or eligible placement cells.</div>';g.drawers.forEach((d,i)=>html+=moduleCard(d.id,d.name,'Fill drawer',drawerBody(d,i,g),d.enabled,'drawer',i));
 html+=`<div class="addRow"><button data-add-drawer="fill">+ Fill Drawer</button><span></span></div></div>`;$('#inspector').innerHTML=html;bindInspector()}
function getTarget(scope,index){const g=selected();if(scope==='gen')return g;if(scope==='placement')return g.placement;if(scope==='selector')return g.selectors[+index];if(scope==='mutator')return g.mutators[+index];if(scope==='drawer')return g.drawers[+index]}
function bindInspector(){const I=$('#inspector');I.querySelectorAll('[data-scope]').forEach(el=>{const evt=el.type==='range'||el.type==='color'?'input':'change';el.addEventListener(evt,()=>{const o=getTarget(el.dataset.scope,el.dataset.index),key=el.dataset.key;if(!o)return;let v=el.type==='checkbox'?el.checked:el.value;if(el.type==='range'||el.type==='number')v=+v;o[key]=v;const val=el.parentElement?.querySelector('.value');if(val&&el.type==='range'){const suffix=(val.textContent.match(/[^\d.\-]+$/)||[''])[0];val.textContent=v+suffix}if(el.type==='color'&&val)val.textContent=v;if(el.dataset.rerender){renderTree();renderInspector()}else{build();renderTreeMetaOnly()}schedule();save()})});I.querySelectorAll('[data-fill-key]').forEach(el=>{const evt=el.type==='range'||el.type==='color'?'input':'change';el.addEventListener(evt,()=>{const d=selected().drawers[+el.dataset.drawerIndex],f=d?.fills[+el.dataset.fillIndex];if(!f)return;f[el.dataset.fillKey]=el.type==='range'?+el.value:el.value;const val=el.parentElement?.querySelector('.value');if(val&&el.type==='range')val.textContent=el.value+'°';if(el.dataset.rerender)renderInspector();schedule();save()})});I.querySelectorAll('[data-anchor]').forEach(b=>b.onclick=e=>{e.stopPropagation();selected().anchor=b.dataset.anchor;selectedModule='generator';renderTree();renderInspector();schedule();save()});I.querySelectorAll('.sectionHead,.moduleHead').forEach(h=>h.onclick=e=>{if(e.target.closest('button,input,label,select'))return;h.parentElement.classList.toggle('collapsed');const id=h.parentElement.dataset.module;if(id){selectedModule=id;schedule()}});I.querySelectorAll('[data-module]').forEach(card=>{card.onmouseenter=()=>{hoveredModule=card.dataset.module;card.classList.add('activeGizmo');schedule()};card.onmouseleave=()=>{hoveredModule=null;card.classList.remove('activeGizmo');schedule()}});I.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();const p=b.parentElement,was=p.classList.contains('open');I.querySelectorAll('.addMenu').forEach(x=>x.classList.remove('open'));if(!was)p.classList.add('open')});I.querySelectorAll('[data-add-selector]').forEach(b=>b.onclick=()=>{const s=defaultSelector(b.dataset.addSelector);selected().selectors.push(s);selectedModule=s.id;renderInspector();schedule();save()});I.querySelectorAll('[data-add-mutator]').forEach(b=>b.onclick=()=>{const m=defaultMutator(b.dataset.addMutator);selected().mutators.push(m);selectedModule=m.id;renderInspector();schedule();save()});I.querySelectorAll('[data-add-drawer]').forEach(b=>b.onclick=()=>{const d=defaultDrawer();selected().drawers.push(d);selectedModule=d.id;renderInspector();schedule();save()});I.querySelectorAll('[data-add-fill]').forEach(b=>b.onclick=()=>{const d=selected().drawers[+b.dataset.drawerIndex];d.fills.push(b.dataset.addFill==='gradient'?defaultFill('gradient','#293449','#79b4d2'):defaultFill('flat','#667788','#667788'));renderInspector();schedule();save()});I.querySelectorAll('[data-remove-fill]').forEach(b=>b.onclick=()=>{const d=selected().drawers[+b.dataset.drawerIndex];if(d.fills.length>1)d.fills.splice(+b.dataset.removeFill,1);renderInspector();schedule();save()});I.querySelectorAll('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();const g=selected(),kind=b.dataset.remove,arr=kind==='selector'?g.selectors:kind==='mutator'?g.mutators:g.drawers,removed=arr.splice(+b.dataset.index,1)[0];if(kind==='selector'){g.mutators.forEach(m=>{if(m.selector===removed.id)m.selector='all'});g.drawers.forEach(d=>{if(d.selector===removed.id)d.selector='all'})}selectedModule='generator';renderInspector();schedule();save()})}
$('#inspector').addEventListener('change',e=>{if(e.target?.dataset?.key==='bias')renderInspector()});
$('#inspector').addEventListener('click',e=>{const b=e.target.closest?.('[data-move-module]');if(!b)return;e.stopPropagation();const a=b.dataset.moveScope==='drawer'?selected().drawers:selected().mutators,i=+b.dataset.index,j=i+(+b.dataset.moveModule);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];selectedModule=a[j].id;renderInspector();schedule();save()});
function renderTreeMetaOnly(){const sel=state.selectedId;renderTree();state.selectedId=sel}
function addChild(){const p=selected(),g=defaultGen('New Child Generator'),cellParent=p.placement.type==='grid'||p.placement.type==='boxRow';if(cellParent){g.areaBasis='cell';g.sizeX=100;g.sizeY=100;g.spawnEvery=1;g.shape='square'}else{g.sizeX=18;g.sizeY=18;g.spawnEvery=2}p.children.push(g);state.selectedId=g.id;selectedModule='generator';renderTree();renderInspector();schedule();save()}
function duplicate(){const f=findGen(state.selectedId);if(!f||!f.parent)return;const copy=JSON.parse(JSON.stringify(f.g));function newid(g){g.id=rid('gen');g.name+=' copy';g.placement.id=rid('place');g.selectors.forEach(s=>s.id=rid('sel'));g.mutators.forEach(m=>{m.id=rid('mut');m.selector='all'});g.drawers.forEach(d=>{d.id=rid('draw');d.selector='all';d.fills.forEach(f=>f.id=rid('fill'))});g.children.forEach(newid)}newid(copy);f.parent.children.push(copy);state.selectedId=copy.id;renderTree();renderInspector();schedule();save()}
function removeSelected(){const f=findGen(state.selectedId);if(!f||!f.parent)return;f.parent.children=f.parent.children.filter(x=>x!==f.g);state.selectedId=f.parent.id;renderTree();renderInspector();schedule();save()}
function moveSelected(delta){const f=findGen(state.selectedId);if(!f||!f.parent)return;const a=f.parent.children,i=a.indexOf(f.g),j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderTree();schedule();save()}
$('#addChildBtn').onclick=addChild;$('#upBtn').onclick=()=>moveSelected(-1);$('#downBtn').onclick=()=>moveSelected(1);$('#duplicateBtn').onclick=duplicate;$('#deleteBtn').onclick=removeSelected;$('#gizmoMode').value=state.gizmoMode;$('#gizmoMode').onchange=e=>{state.gizmoMode=e.target.value;schedule();save()};$('#reseedBtn').onclick=()=>{state.seed=Math.floor(Math.random()*999999);schedule();renderTree();renderInspector();save()};$('#resetBtn').onclick=()=>{if(confirm('Reset the whole generator hierarchy to the demo?')){state=demo();$('#gizmoMode').value=state.gizmoMode;renderTree();renderInspector();schedule();save()}};$('#exportBtn').onclick=()=>{const old=state.gizmoMode;state.gizmoMode='none';draw();const a=document.createElement('a');a.download='dot-foundry-'+state.seed+'.png';a.href=C.toDataURL('image/png');a.click();state.gizmoMode=old;schedule()};
$('#zoomOutBtn').onclick=()=>setZoom(view.zoom/1.25);$('#zoomInBtn').onclick=()=>setZoom(view.zoom*1.25);$('#fitBtn').onclick=fitView;
viewport.addEventListener('wheel',e=>{e.preventDefault();setZoom(view.zoom*Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;view.dragging=true;view.pointerId=e.pointerId;view.lastX=e.clientX;view.lastY=e.clientY;viewport.setPointerCapture(e.pointerId);viewport.classList.add('panning')});
viewport.addEventListener('pointermove',e=>{if(!view.dragging||e.pointerId!==view.pointerId)return;view.panX+=e.clientX-view.lastX;view.panY+=e.clientY-view.lastY;view.lastX=e.clientX;view.lastY=e.clientY;updateView()});
function endPan(e){if(!view.dragging||e.pointerId!==view.pointerId)return;view.dragging=false;view.pointerId=null;viewport.classList.remove('panning')}
viewport.addEventListener('pointerup',endPan);viewport.addEventListener('pointercancel',endPan);viewport.ondblclick=fitView;
document.addEventListener('click',e=>{if(!e.target.closest('.addMenu'))document.querySelectorAll('.addMenu').forEach(x=>x.classList.remove('open'))});document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='Escape')document.querySelectorAll('.addMenu').forEach(x=>x.classList.remove('open'));if(e.key==='0')fitView();if(e.key==='+'||e.key==='=')setZoom(view.zoom*1.25);if(e.key==='-')setZoom(view.zoom/1.25)});
if('ResizeObserver'in window)new ResizeObserver(updateView).observe(viewport);else window.addEventListener('resize',updateView);
renderTree();renderInspector();draw();requestAnimationFrame(fitView);
})();
</script>
